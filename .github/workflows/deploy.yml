name: Crawl & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # RSS가 막힌 사이트(뽐뿌·클리앙·퀘이사존·올리브영)는 scrapling 브라우저로 수집. 실패해도 나머지는 계속 진행.
      - name: Scrape with browser
        continue-on-error: true
        timeout-minutes: 8
        working-directory: worker/scrape
        run: |
          pip install -q "scrapling[all]>=0.5.1"
          python scrape.py scraped.json clien ppomppu  # 퀘이사존·올리브영은 GitHub IP가 403 → local.json(로컬 PC 수집)
      - name: Crawl
        working-directory: worker
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: node scripts/crawl.mjs ../site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
