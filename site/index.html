<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>뷰티핫딜 · 화장품 핫딜 & 이벤트 모음</title>
  <meta name="description" content="뽐뿌, 루리웹, 클리앙 등 커뮤니티의 화장품 핫딜과 올리브영·뷰티 이벤트 소식을 한곳에서." />
  <meta name="theme-color" content="#fbf7f4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💄</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>뷰티<em>핫딜</em></h1>
        <p class="sub" id="updated">불러오는 중…</p>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="브랜드, 제품, 쇼핑몰 검색" autocomplete="off" />
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button data-kind="all" class="on" role="tab">전체</button>
        <button data-kind="deal" role="tab">핫딜</button>
        <button data-kind="event" role="tab">이벤트</button>
        <button data-kind="fav" role="tab">찜</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <select id="sort" aria-label="정렬">
        <option value="new">최신순</option>
        <option value="price">낮은 가격순</option>
      </select>
    </div>
    <ul class="list" id="list" aria-live="polite"></ul>
    <p class="empty" id="empty" hidden></p>
  </main>

  <footer class="wrap foot">
    <p id="sources"></p>
    <p>각 게시글의 저작권은 원 작성자와 출처 사이트에 있습니다. 가격·재고는 출처에서 꼭 확인하세요.</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
